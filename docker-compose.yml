version: '3.8'

services:
  app:
    build: .
    container_name: ms-meetings
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./src/config/firebase/serviceAccountKey.json:/app/src/config/firebase/serviceAccountKey.json

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command: http --domain=${NGROK_DOMAIN} app:${PORT}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4141:4040"
    depends_on:
      - app